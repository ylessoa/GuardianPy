[project]
name = "GuardianPy"
version = "0.2.0"
description = "GuardianPy Community defensive antimalware suite: scanner, quarantine, resident guard, signatures, ports and hardening."
requires-python = ">=3.10"
authors = [{name = "Skywork Code"}]
dependencies = ["psutil>=5.9.0"]

[project.scripts]
GuardianPy = "GuardianPy.cli:main"
GuardianPy-gui = "GuardianPy.ui.tk_app:main"
GuardianPy-resident = "GuardianPy.service.resident:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
GuardianPy = ["signatures/*.json", "assets/*.svg"]
