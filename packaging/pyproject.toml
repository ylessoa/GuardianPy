[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardianpy"
version = "0.2.0"
description = "GuardianPy Community defensive antimalware suite: scanner, quarantine, resident guard, signatures, ports and hardening."
requires-python = ">=3.10"
authors = [{name = "Skywork Code"}]
dependencies = [
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "pefile>=2023.2.7",
    "requests>=2.31.0",
    "plyer>=2.1.0"
]

[project.scripts]
guardianpy = "guardianpy.cli:main"
guardianpy-gui = "guardianpy.app:main"
guardianpy-resident = "guardianpy.services.resident:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["guardianpy*"]

[tool.setuptools.package-data]
"*" = ["signatures/*.json", "assets/*.svg"]
