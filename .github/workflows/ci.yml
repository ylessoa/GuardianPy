name: GuardianPy CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest

    - name: Initialize integrity baseline
      run: |
        echo "🧩 Creando baseline de integridad..."
        python -c "from guardianpy.core.integrity_monitor import initialize_baseline; initialize_baseline()"
        echo "✅ Baseline creado."

    - name: Run tests
      run: |
        echo "🚀 Ejecutando pruebas..."
        pytest -q --disable-warnings || exit 1
        echo "✅ Todas las pruebas completadas."
    - name: Install GuardianPy in editable mode
      run: |
        pip install -e .
