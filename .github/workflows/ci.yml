name: GuardianPy CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Fix imports
      run: ./fix_imports_extended.sh

    - name: Check for old imports
      shell: bash
      run: |
        # Solo revisar archivos Python, ignorando documentación y scripts auxiliares
        if grep -R "guardianx" --include="*.py" .; then
          echo "❌ Found invalid import 'guardianx' in Python code"
          exit 1
        fi
        if grep -R "GuardianPy" --include="*.py" .; then
          echo "❌ Found invalid import 'GuardianPy' in Python code"
          exit 1
        fi
        echo "✅ No invalid imports found in Python code"

    - name: Run tests
      run: pytest -q
