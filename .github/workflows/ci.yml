name: GuardianPy CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    # Bloque condicional para Windows
    - name: Fix imports (Windows)
      if: runner.os == 'Windows'
      run: powershell.exe -ExecutionPolicy Bypass -File .\fix_imports_extended.ps1

    # Bloque condicional para Linux/macOS
    - name: Fix imports (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        chmod +x ./fix_imports_extended.sh
        ./fix_imports_extended.sh

    - name: Check for old imports
      shell: bash
      run: |
        # Solo revisar archivos Python, ignorando documentación y scripts auxiliares
        if grep -R "guardianx" --include="*.py" .; then
          echo "❌ Found invalid import 'guardianx' in Python code"
          exit 1
        fi
        echo "✅ No invalid imports found in Python code"
    - name: Fix imports (Windows)
      if: runner.os == 'Windows'
      run: |
      Write-Host "🔍 Verificando ruta actual..."
      Get-Location
      Write-Host "📂 Archivos disponibles:"
      Get-ChildItem -Path . -Name
        if (Test-Path "$PWD\fix_imports_extended.ps1") {
        Write-Host "✅ Script encontrado, ejecutando..."
        powershell.exe -ExecutionPolicy Bypass -File "$PWD\fix_imports_extended.ps1"
        } else {
          Write-Host "⚠️ Script fix_imports_extended.ps1 no encontrado, se omite este paso."
          }

    - name: Run tests
      run: pytest -q
