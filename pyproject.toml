[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GuardianPy"
version = "0.1.0"
description = "Herramienta de seguridad GuardianPy"
authors = [{ name = "José Luis Gómez Salgado" }]
dependencies = [
    "psutil==6.1.0",
    "requests==2.32.3",
    "yara-python==4.5.4",
    "pytest>=8.3.4,<9.0.0",
    "colorama==0.4.6",
    "cryptography==43.0.1",
    "pyinstaller==6.10.0",
    "watchdog==4.0.1",
]
